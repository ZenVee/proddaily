<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prod Daily</title>
  </head>
  <body>
    <svg aria-hidden="true" width="0" height="0" style="position:absolute">
      <defs>
        <filter id="pd-distress" x="-4%" y="-8%" width="108%" height="124%">
          <feTurbulence type="fractalNoise" baseFrequency="0.025 0.42" numOctaves="2" seed="4" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2.1" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="pd-distress-lite" x="-2%" y="-6%" width="104%" height="116%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02 0.5" numOctaves="1" seed="2" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="0.65" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
